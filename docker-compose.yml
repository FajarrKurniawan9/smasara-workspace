services:
  # 1. Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 531269
      POSTGRES_DB: smasara_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smasara_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Go Backend
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:531269@db:5432/smasara_db?sslmode=disable
      - JWT_SECRET=smasara_super_secret_jwt_key_development_only_12345
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=531269
      - DB_NAME=smasara_db

  # 3. Svelte Frontend (Production Container)
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8080
      - PORT=5173
      - HOST=0.0.0.0
      - NODE_ENV=production
volumes:
  # Ini memastikan data database Anda tidak hilang saat container dimatikan
  postgres_data:
