version: '3.8'

services:
  # 1. Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: smasara
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Go Backend
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password123
      - DB_NAME=smasara

  # 3. Svelte Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # Fitur ini menghubungkan folder lokal Anda ke dalam container
    # sehingga Anda tidak perlu merestart docker saat mengedit file Svelte
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  # Ini memastikan data database Anda tidak hilang saat container dimatikan
  postgres_data:
